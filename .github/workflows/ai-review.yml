name: AI Code Review (Gemini)

on:
  pull_request:
    # Triggered when creating the PR or pushing new commits to it
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Importante: traer historial suficiente para hacer el diff
          fetch-depth: 0 

      - name: Gemini Code Review
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          # Inyecta el token de GitHub para que el agente pueda publicar los comentarios
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Inyecta tu API Key nativa directamente
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          # Especifica el modelo Pro que quieres utilizar
          model: "gemini-3.5-flash-lite"
          # Tus reglas de revisión customizadas
          prompt: |
            You are an expert software architect.
            Review this code.
            You must strictly verify:
            1. That the corresponding unit tests are included (TDD approach).
            2. That the code has appropriate comments.
            3. That it complies with Clean Code standards.